# Publishes the web app to GitHub Pages on every push to main.
#
# Pages serves this repo at /ShiftAI/, a subpath rather than a domain root.
# That needs no --base-href here: tool/build_web_hosted.sh writes its own
# index.html with no <base> and every path relative, so the bundle resolves
# against whatever directory it is served from. Checked by serving the
# built output under a /ShiftAI/ prefix and loading it — it renders.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a partial upload
# would leave the live site serving a mix of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  FLUTTER_VERSION: 3.35.1

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Build hosted web bundle
        # The same script the release workflow uses, so the site and the
        # release artifact are the same build rather than two that drifted.
        run: bash tool/build_web_hosted.sh

      - uses: actions/configure-pages@v5
        with:
          # Turns Pages on if it is not already, so this does not need a
          # visit to the repository settings before the first deploy.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
